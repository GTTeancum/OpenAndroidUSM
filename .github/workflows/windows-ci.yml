name: Windows MSVC build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-release

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc-release --parallel

      - name: Run asset-independent parity tests
        shell: pwsh
        run: ctest --test-dir build/windows-msvc -C Release -R '^(OpenAndroidUSM\.InputParity\.(buttons|routing|sticks|autoplay|transitions)|OpenAndroidUSM\.QteParity\.(clock|attributes)|OpenAndroidUSM\.QteControl\.keypad|OpenAndroidUSM\.HostageIntegration\.dispatch|OpenAndroidUSM\.ReferenceRecoveryTests|OpenAndroidUSM\.BridgeAttachmentTests|OpenAndroidUSM\.SandmanPhaseTests|OpenAndroidUSM\.EnemySpecialActionTests|OpenAndroidUSM\.AudioBackendTests|OpenAndroidUSM\.D3D11BackendTests)$' --output-on-failure --no-tests=error

      - name: Run Windows D3D11 startup smoke
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'startup-smoke.usmauto'
          $output = Join-Path $env:RUNNER_TEMP 'startup-smoke-output'
          Set-Content -LiteralPath $script -Value 'finish' -Encoding ascii
          $stdout = Join-Path $env:RUNNER_TEMP 'startup-smoke.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'startup-smoke.stderr.txt'
          $process = Start-Process -FilePath '.\build\windows-msvc\Release\OpenAndroidUSM.exe' `
              -ArgumentList @('--autoplay', $script, '--output', $output) `
              -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $log = @()
          if (Test-Path -LiteralPath $stdout) { $log += Get-Content -LiteralPath $stdout }
          if (Test-Path -LiteralPath $stderr) { $log += Get-Content -LiteralPath $stderr }
          $log | Write-Host
          if ($process.ExitCode -ne 1) {
              throw "Expected missing-data exit code 1, got $($process.ExitCode)"
          }
          if (($log -join "`n") -notmatch 'Game data was not found') {
              throw 'Executable did not reach post-D3D11 game-data lookup'
          }

      - name: Probe Windows XAudio2 startup
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'audio-startup-smoke.usmauto'
          $output = Join-Path $env:RUNNER_TEMP 'audio-startup-smoke-output'
          Set-Content -LiteralPath $script -Value 'finish' -Encoding ascii
          $stdout = Join-Path $env:RUNNER_TEMP 'audio-startup-smoke.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'audio-startup-smoke.stderr.txt'
          $process = Start-Process -FilePath '.\build\windows-msvc\Release\OpenAndroidUSM.exe' `
              -ArgumentList @('--autoplay', $script, '--output', $output, '--autoplay-audio') `
              -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $log = @()
          if (Test-Path -LiteralPath $stdout) { $log += Get-Content -LiteralPath $stdout }
          if (Test-Path -LiteralPath $stderr) { $log += Get-Content -LiteralPath $stderr }
          $log | Write-Host
          if ($process.ExitCode -ne 1) {
              throw "Expected missing-data exit code 1, got $($process.ExitCode)"
          }
          $joined = $log -join "`n"
          if ($joined -match 'Game data was not found') {
              Write-Host 'XAudio2 startup reached game-data lookup.'
          } elseif ($joined -match 'IXAudio2::CreateMasteringVoice failed \(HRESULT 0x80070490\)') {
              Write-Warning 'Runner has no default Windows audio endpoint; runtime audio test is skipped.'
          } elseif ($joined -match 'IXAudio2::CreateMasteringVoice failed') {
              throw 'Unexpected XAudio2 mastering-voice failure'
          } else {
              throw 'Executable failed before a classified XAudio2 startup result'
          }
